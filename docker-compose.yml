services:
  postgres:
    image: postgres:16
    container_name: learning-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: learning_app
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: learning_app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: learning-app-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://learning_app:dev_password@postgres:5432/learning_app_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: learning-app-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: